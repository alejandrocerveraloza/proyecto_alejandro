<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI HelpDesk Router - Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f1f5f9; font-family: 'Inter', sans-serif; }
        .main-card { background: #1e293b; border: 1px solid #334155; border-radius: 1rem; margin-top: 3rem; overflow: hidden; }
        .header { background: #334155; padding: 1.5rem; text-align: center; }
        .badge-cat { background: #3b82f6; }
        .badge-ia { background: #10b981; }
        #resp-area { background: #0f172a; border: 1px solid #334155; padding: 1rem; border-radius: 0.5rem; min-height: 100px; white-space: pre-line; }
        .loading { display: none; }
    </style>
</head>
<body>
    <div class="container" style="max-width: 750px;">
        <div class="main-card shadow-lg">
            <div class="header">
                <h2 class="h4 mb-0">🖥️ HelpDesk AI Router</h2>
                <small class="text-secondary">Sistema de Enrutamiento Inteligente - ASIR</small>
            </div>
            <div class="p-4">
                <div class="mb-3">
                    <label class="form-label">Describe la incidencia o consulta:</label>
                    <textarea id="prompt" class="form-control bg-dark text-white border-secondary" rows="3" placeholder="Ej: ¿Cómo resetear un switch Cisco?"></textarea>
                </div>
                <button onclick="procesar()" id="btnAction" class="btn btn-primary w-100 py-2 fw-bold">ENVIAR A ENRUTADOR</button>

                <div id="resultado" class="mt-4" style="display:none;">
                    <div class="d-flex justify-content-between mb-3">
                        <span>Intención: <span id="cat" class="badge badge-cat"></span></span>
                        <span>Modelo Asignado: <span id="ia" class="badge badge-ia"></span></span>
                    </div>
                    <div class="mt-2">
                        <strong>Solución sugerida:</strong>
                        <div id="resp-area" class="mt-2 text-info"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function procesar() {
            const prompt = document.getElementById('prompt').value;
            const btn = document.getElementById('btnAction');
            if(!prompt) return;

            btn.disabled = true;
            btn.innerHTML = 'Enrutando...';

            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({prompt: prompt})
                });
                const data = await response.json();
                
                document.getElementById('resultado').style.display = 'block';
                document.getElementById('cat').innerText = data.categoria_detectada.toUpperCase();
                document.getElementById('ia').innerText = data.ia_utilizada;
                document.getElementById('resp-area').innerText = data.respuesta;
            } catch (e) {
                alert("Error de conexión");
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'ENVIAR A ENRUTADOR';
            }
        }
    </script>
</body>
</html>
